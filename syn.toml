# Private payroll on Vela (Horizen) as a recipe: the entry is the employer's console (web.syn), a web app
# that embeds app/app.syn into the release's guest module, deploys it to Vela and runs the payroll from
# the browser. This file only says what the code cannot say about itself; the `require` blocks are
# the manifests of capabilities. The CLI in client/ does the same from a terminal.

name = "Private payroll"
slug = "vela-payroll"
version = "0.2.6"
kind = "web"
entry = "web.syn"
engine = "0.6"
tagline = "Private payroll on Horizen's Vela, in Synsema: an employer pays a list of people in a stablecoin; nobody outside sees who earns what, each person sees only their payslips, and an auditor gets the report."
tagline_es = "Nómina privada en Vela (Horizen) con Synsema: una empresa paga a una lista de personas en stablecoin; nadie afuera ve quién cobra cuánto, cada una ve sólo sus recibos y el auditor recibe el reporte."
tagline_pt = "Folha de pagamento privada no Vela (Horizen) com Synsema: uma empresa paga uma lista de pessoas em stablecoin; ninguém de fora vê quem ganha quanto, cada uma vê só os seus holerites e o auditor recebe o relatório."

[secrets]
VELA_SECP_KEY = "the employer's secp256k1 key: signs the transactions and pays the fees (hex). On the public devnet the token comes with an account of its own: a deployer with ETH and test tokens."
VELA_ADMIN_KEY = "the admin key when the kit signs allow-token and allow-authority itself (a devnet of your own). Empty on the public devnet, whose admin desk signs them (VELA_ADMIN_URL), and on a local kit, where the signing key is the admin."
VELA_P521_KEY = "P-521 private key for the encrypted channel with the Executor (hex). Provisioned on the devnet; made by the app itself when empty."

# The public Vela devnet by default: the provision URL hands out a token of your own and fills these
# (and the keys) when the project is created. Point them at your own Vela stack to leave the devnet.
[env]
VELA_RPC_URL = "https://devnet.synsema.app/<token>/rpc"
VELA_AUTHORITY_URL = "https://devnet.synsema.app/<token>/authority"
VELA_SUBGRAPH_URL = "https://devnet.synsema.app/<token>/subgraph/subgraphs/name/hcce"
VELA_PROCESSOR = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
VELA_TEE_AUTHENTICATOR = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
VELA_TOKEN = ""
VELA_MAX_FEE = "100"

[provision]
env_url = "https://devnet.synsema.app/token"

# the app's state: the app id, the keys it made, the people it onboarded, the runs
[volumes]
data = "./data"
